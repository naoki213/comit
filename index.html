<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="comit">
  <meta name="description" content="大きな目標と毎日のコミットを管理するアプリ">
  <title>comit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 起動時のロード画面 -->
  <div id="splash" aria-hidden="true">
    <img src="assets/splash.png" alt="">
  </div>

  <!-- 背景の波 -->
  <svg class="bg-wave bg-wave--top" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="wg1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5cc8f2"/><stop offset="1" stop-color="#9be7b4"/>
      </linearGradient>
    </defs>
    <path d="M0,170 C80,90 160,60 240,40 C300,25 360,10 400,0 L0,0 Z" fill="url(#wg1)" opacity=".22"/>
    <path d="M0,230 C60,140 140,80 220,60 C300,40 350,15 400,0 L0,0 Z" fill="url(#wg1)" opacity=".12"/>
    <path d="M0,200 C70,120 150,75 250,48 C320,30 370,12 400,2" fill="none" stroke="#fff" stroke-width="1.5" opacity=".9"/>
  </svg>
  <svg class="bg-wave bg-wave--bottom" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="wg2" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#9be7d0"/><stop offset="1" stop-color="#5cc0f2"/>
      </linearGradient>
    </defs>
    <path d="M0,300 L0,250 C90,210 170,240 250,200 C320,165 370,110 400,80 L400,300 Z" fill="url(#wg2)" opacity=".2"/>
    <path d="M0,300 L0,275 C100,250 200,270 280,230 C340,200 380,150 400,130 L400,300 Z" fill="url(#wg2)" opacity=".2"/>
    <path d="M0,262 C100,228 190,255 265,215 C330,180 375,125 400,98" fill="none" stroke="#fff" stroke-width="1.5" opacity=".9"/>
  </svg>

  <div id="app">
    <header class="topbar">
      <img class="topbar__logo" src="assets/wordmark.png" alt="comit">
      <div class="topbar__date" id="todayLabel"></div>
    </header>

    <main id="pager" aria-live="polite"></main>

    <nav id="dots" aria-label="目標ページ"></nav>
  </div>

  <button id="fab" aria-label="大きな目標を追加">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>

  <!-- ボトムシート -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <form class="sheet__panel" id="sheetForm" autocomplete="off">
      <div class="sheet__grip"></div>
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <div id="sheetBody"></div>
      <div class="sheet__actions">
        <button type="button" class="btn btn--danger" id="sheetDelete" hidden>削除</button>
        <button type="button" class="btn btn--ghost" data-close>キャンセル</button>
        <button type="submit" class="btn btn--primary" id="sheetSubmit">保存</button>
      </div>
    </form>
  </div>

  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
